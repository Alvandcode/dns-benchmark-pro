[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-benchmark-pro"
version = "1.2.0"
description = "Advanced DNS Benchmark Tool (UDP, DoH, DoT)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "matplotlib>=3.5",
]

[project.scripts]
dns-benchmark = "dns_benchmark.cli:run_cli"

[tool.setuptools.packages.find]
include = ["dns_benchmark*"]
